name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check C# formatting
        shell: pwsh
        run: ./format.ps1 -Verify
      - name: Build and run unit and bridge tests
        shell: powershell
        run: ./test.ps1 -SkipUi
      - name: Package without vendor binaries
        shell: powershell
        run: ./package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: ASUS-FanPilot
          path: dist/*.zip
